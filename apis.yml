aid: hongshan
name: HongShan (HSG)
description: >-
  HongShan (HSG), formerly known as Sequoia Capital China, is a leading global
  venture capital and private equity firm investing across technology, healthcare,
  and consumer sectors. Founded in 2005 by Neil Shen with early guidance from
  Sequoia Capital, the firm spun off as an independent entity in 2023-2024,
  rebranding from Sequoia China to HongShan (a pinyin romanization of its Chinese
  name, meaning "redwood") while retaining its original Chinese name. HSG invests
  across the full lifecycle - seed, venture, growth, buyout, and infrastructure -
  and also runs a public equities business (HCEP). The firm manages over USD 61
  billion in assets (as of April 30, 2026) and has backed more than 1,700 companies
  since inception, with 180+ having gone public and 140+ reaching unicorn status.
  HSG operates from Hong Kong, Shanghai, Beijing, Shenzhen, London, Tokyo, and
  Singapore. Notable portfolio companies include Alibaba, ByteDance, Meituan,
  Pinduoduo, BYD, Nio, Xpeng, Airwallex, Canva, Monzo, and Moderna.
